name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go work sync

      - name: Verify modules
        run: go work verify

      - name: Run tests
        run: go work test ./...

      - name: Build services
        run: |
          cd services/auth && go build ./cmd/auth
          cd ../notification && go build ./cmd/notification
          cd ../gateway && go build ./cmd/gateway || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint on pkg/logger
        run: golangci-lint run ./pkg/logger/...

      - name: Run golangci-lint on services/auth
        run: golangci-lint run ./services/auth/...

      - name: Run golangci-lint on services/notification
        run: golangci-lint run ./services/notification/...

      - name: Run golangci-lint on services/gateway
        run: golangci-lint run ./services/gateway/... || true
